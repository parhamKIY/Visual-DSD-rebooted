name: Engine baseline

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Verify original reference and rebooted engine
        shell: pwsh
        run: ./eng/test.ps1 -Locked
      - name: Verify workspace data handling and plots
        shell: pwsh
        run: ./eng/test-ui.ps1
      - name: Publish and verify standalone application
        shell: pwsh
        run: |
          $runtime = if ($IsWindows) { 'win-x64' } else { 'linux-x64' }
          ./eng/publish.ps1 -Runtime $runtime
          ./eng/smoke.ps1 -Runtime $runtime
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build or publish changed tracked files.' }
          if (git ls-files --others --exclude-standard) { throw 'Build or publish created untracked files.' }
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: engine-tests-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore
