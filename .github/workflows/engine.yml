name: Engine baseline

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify original reference and rebooted engine
        shell: pwsh
        run: ./eng/test.ps1 -Locked
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-tests-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore
