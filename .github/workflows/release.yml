name: Publish verified classroom release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Application version, for example 0.21.0'
        required: true
        type: string
      verify_run_id:
        description: 'Successful Engine baseline run for the current master commit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: classroom-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Validate packages and publish release
        run: python eng/release.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
